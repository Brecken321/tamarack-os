---
name: Disk images and VM test

on:
  # After every successful image build on main: boot-test the new images.
  workflow_run:
    workflows: ["Build images"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      iso:
        description: "Also build installer ISOs (after the VM test passes)"
        type: boolean
        default: true
  schedule:
    # Weekly fresh installer ISOs.
    - cron: "0 9 * * 1"

# Queue rather than cancel: a VM test that is already running always finishes.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  BIB_IMAGE: "quay.io/centos-bootc/bootc-image-builder:latest"

jobs:
  vm-test:
    name: Boot test (${{ matrix.flavor }})
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-26.04
    timeout-minutes: 150
    permissions:
      contents: read
      packages: read
    strategy:
      fail-fast: false
      matrix:
        flavor: [main, nvidia]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Maximize build space
        uses: ublue-os/remove-unwanted-software@695eb75bc387dbcd9685a8e72d23439d8686cba6
        with:
          remove-codeql: true

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm

      - name: Install QEMU
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends qemu-system-x86 qemu-utils ovmf openssh-client

      - name: Resolve image
        id: meta
        run: |
          set -a; source image.env; set +a
          if [[ "${{ matrix.flavor }}" == "nvidia" ]]; then image="${IMAGE_NVIDIA}"; else image="${IMAGE_MAIN}"; fi
          echo "ref=${IMAGE_REGISTRY}/${image}:${DEFAULT_TAG}" >> "$GITHUB_OUTPUT"

      - name: Prepare a throwaway test user
        id: user
        run: |
          # A random password and SSH key that exist only for this VM run.
          password="$(openssl rand -hex 10)"
          echo "::add-mask::${password}"
          echo "password=${password}" >> "$GITHUB_OUTPUT"
          ssh-keygen -q -t ed25519 -N "" -f "${RUNNER_TEMP}/vmkey"
          cat > disk_config/ci-vm.toml <<EOF
          [[customizations.user]]
          name = "tamarack"
          password = "${password}"
          key = "$(cat "${RUNNER_TEMP}/vmkey.pub")"
          groups = ["wheel"]

          [customizations.services]
          enabled = ["sshd"]

          [[customizations.filesystem]]
          mountpoint = "/"
          minsize = "40 GiB"
          EOF

      - name: Build VM disk image (qcow2)
        id: build
        uses: osbuild/bootc-image-builder-action@8661cd3832544ad68c12dcde8681b13ab0f56a8d # main
        with:
          builder-image: ${{ env.BIB_IMAGE }}
          config-file: ./disk_config/ci-vm.toml
          image: ${{ steps.meta.outputs.ref }}
          types: qcow2
          additional-args: --use-librepo=True

      - name: Boot and test
        run: |
          disk="$(find "${{ steps.build.outputs.output-directory }}" -name '*.qcow2' | head -n 1)"
          bash tests/vm/run-vm-test.sh "${disk}" "${RUNNER_TEMP}/vmkey" "${{ steps.user.outputs.password }}" vm-results

      - name: Upload screenshots and logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: vm-results-${{ matrix.flavor }}
          path: |
            vm-results/screens
            vm-results/*.txt
            vm-results/*.json
            vm-results/serial.log
          if-no-files-found: warn
          retention-days: 30

  iso:
    name: Installer ISO (${{ matrix.flavor }})
    needs: vm-test
    if: (github.event_name == 'workflow_dispatch' && inputs.iso) || github.event_name == 'schedule'
    runs-on: ubuntu-26.04
    timeout-minutes: 120
    permissions:
      contents: read
      packages: read
    strategy:
      fail-fast: false
      matrix:
        flavor: [main, nvidia]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Maximize build space
        uses: ublue-os/remove-unwanted-software@695eb75bc387dbcd9685a8e72d23439d8686cba6
        with:
          remove-codeql: true

      - name: Resolve image
        id: meta
        run: |
          set -a; source image.env; set +a
          if [[ "${{ matrix.flavor }}" == "nvidia" ]]; then image="${IMAGE_NVIDIA}"; else image="${IMAGE_MAIN}"; fi
          echo "ref=${IMAGE_REGISTRY}/${image}:${DEFAULT_TAG}" >> "$GITHUB_OUTPUT"
          echo "name=${image}" >> "$GITHUB_OUTPUT"

      - name: Build installer ISO
        id: build
        uses: osbuild/bootc-image-builder-action@8661cd3832544ad68c12dcde8681b13ab0f56a8d # main
        with:
          builder-image: ${{ env.BIB_IMAGE }}
          config-file: ./disk_config/iso-${{ matrix.flavor }}.toml
          image: ${{ steps.meta.outputs.ref }}
          types: anaconda-iso
          additional-args: --use-librepo=True

      - name: Name and checksum
        id: files
        run: |
          dir="${{ steps.build.outputs.output-directory }}"
          iso="$(find "${dir}" -name '*.iso' | head -n 1)"
          target="${dir}/${{ steps.meta.outputs.name }}-$(date -u +%Y%m%d)-x86_64.iso"
          sudo mv "${iso}" "${target}"
          (cd "${dir}" && sha256sum "$(basename "${target}")" | sudo tee "$(basename "${target}").sha256")
          ls -lh "${dir}"
          echo "dir=${dir}" >> "$GITHUB_OUTPUT"

      - name: Upload ISO
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.meta.outputs.name }}-iso
          path: |
            ${{ steps.files.outputs.dir }}/*.iso
            ${{ steps.files.outputs.dir }}/*.sha256
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
