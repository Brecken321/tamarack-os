---
name: Disk images and VM test

on:
  # After every successful image build on main: boot-test the new images.
  workflow_run:
    workflows: ["Build images"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      iso:
        description: "Also build installer ISOs (after the VM test passes)"
        type: boolean
        default: true
  schedule:
    # Weekly fresh installer ISOs.
    - cron: "0 9 * * 1"

# Queue rather than cancel: a VM test that is already running always finishes.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

# Disk jobs run on ubuntu-24.04: osbuild's container mount fails with EACCES on
# the kernel 7.0 ubuntu-26.04 runners (https://github.com/osbuild/osbuild/issues/2579).
# Move back to ubuntu-26.04 once that issue is fixed.
env:
  BIB_IMAGE: "quay.io/centos-bootc/bootc-image-builder:latest"

jobs:
  vm-test:
    name: Boot test (${{ matrix.flavor }})
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    permissions:
      contents: read
      packages: read
    strategy:
      fail-fast: false
      matrix:
        flavor: [main, nvidia, nvidia-legacy]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Maximize build space
        uses: ublue-os/remove-unwanted-software@695eb75bc387dbcd9685a8e72d23439d8686cba6

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm

      - name: Install QEMU
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends qemu-system-x86 qemu-utils ovmf openssh-client

      - name: Resolve image
        id: meta
        run: |
          set -a; source image.env; set +a
          # main -> IMAGE_MAIN, nvidia-legacy -> IMAGE_NVIDIA_LEGACY, ...
          var="IMAGE_$(tr 'a-z-' 'A-Z_' <<<"${{ matrix.flavor }}")"
          image="${!var}"
          echo "ref=${IMAGE_REGISTRY}/${image}:${DEFAULT_TAG}" >> "$GITHUB_OUTPUT"

      - name: Prepare a throwaway test user
        id: user
        run: |
          # A random password and SSH key that exist only for this VM run.
          password="$(openssl rand -hex 10)"
          echo "::add-mask::${password}"
          echo "password=${password}" >> "$GITHUB_OUTPUT"
          ssh-keygen -q -t ed25519 -N "" -f "${RUNNER_TEMP}/vmkey"
          cat > disk_config/ci-vm.toml <<EOF
          [[customizations.user]]
          name = "tamarack"
          password = "${password}"
          key = "$(cat "${RUNNER_TEMP}/vmkey.pub")"
          groups = ["wheel"]

          # Disk images do not support service customizations; enable sshd via a kernel argument.
          [customizations.kernel]
          append = "systemd.wants=sshd.service"

          [[customizations.filesystem]]
          mountpoint = "/"
          minsize = "40 GiB"
          EOF

      - name: Build VM disk image (qcow2)
        id: build
        run: |
          bash tests/vm/build-disk.sh qcow2 disk_config/ci-vm.toml "${{ steps.meta.outputs.ref }}" "${RUNNER_TEMP}/disk" | tee build.log
          echo "path=$(tail -n 1 build.log)" >> "$GITHUB_OUTPUT"

      - name: Boot and test
        run: bash tests/vm/run-vm-test.sh "${{ steps.build.outputs.path }}" "${RUNNER_TEMP}/vmkey" "${{ steps.user.outputs.password }}" vm-results

      - name: Upload screenshots and logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: vm-results-${{ matrix.flavor }}
          path: |
            vm-results/screens
            vm-results/*.txt
            vm-results/*.json
            vm-results/serial.log
          if-no-files-found: warn
          retention-days: 30

  # An older build updated to the current :stable with the real update service,
  # rebooted and checked, then rolled back.
  update-test:
    name: Update and rollback (main)
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    permissions:
      contents: read
      packages: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Find the build to update from
        id: refs
        run: |
          set -euo pipefail
          set -a; source image.env; set +a
          repo="${IMAGE_REGISTRY}/${IMAGE_MAIN}"
          new_digest="$(skopeo inspect --format '{{.Digest}}' "docker://${repo}:${DEFAULT_TAG}")"
          new_created="$(skopeo inspect --format '{{.Created}}' "docker://${repo}:${DEFAULT_TAG}")"
          old=""
          # Newest dated build that is a different build from the current one
          # (each tag push gets its own manifest digest, so compare creation times).
          for tag in $(skopeo list-tags "docker://${repo}" | jq -r '.Tags[]' | grep -E "^${DEFAULT_TAG}-[0-9]{8}$" | sort -r); do
            if [[ "$(skopeo inspect --format '{{.Created}}' "docker://${repo}:${tag}")" != "${new_created}" ]]; then
              old="${tag}"
              break
            fi
          done
          if [[ -z "${old}" ]]; then
            echo "::notice::No older build to update from yet; skipping the update test."
          fi
          echo "old=${old:+${repo}:${old}}" >> "$GITHUB_OUTPUT"
          echo "new=${repo}:${DEFAULT_TAG}" >> "$GITHUB_OUTPUT"
          echo "new_digest=${new_digest}" >> "$GITHUB_OUTPUT"
          echo "update ${old:-nothing} -> ${DEFAULT_TAG} (${new_digest})"

      - name: Maximize build space
        if: steps.refs.outputs.old != ''
        uses: ublue-os/remove-unwanted-software@695eb75bc387dbcd9685a8e72d23439d8686cba6

      - name: Enable KVM and install QEMU
        if: steps.refs.outputs.old != ''
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends qemu-system-x86 qemu-utils ovmf openssh-client

      - name: Prepare a throwaway test user
        if: steps.refs.outputs.old != ''
        id: user
        run: |
          password="$(openssl rand -hex 10)"
          echo "::add-mask::${password}"
          echo "password=${password}" >> "$GITHUB_OUTPUT"
          ssh-keygen -q -t ed25519 -N "" -f "${RUNNER_TEMP}/vmkey"
          cat > disk_config/ci-vm.toml <<EOF
          [[customizations.user]]
          name = "tamarack"
          password = "${password}"
          key = "$(cat "${RUNNER_TEMP}/vmkey.pub")"
          groups = ["wheel"]

          [customizations.kernel]
          append = "systemd.wants=sshd.service"

          [[customizations.filesystem]]
          mountpoint = "/"
          minsize = "40 GiB"
          EOF

      - name: Build a disk of the older build
        if: steps.refs.outputs.old != ''
        id: build
        run: |
          bash tests/vm/build-disk.sh qcow2 disk_config/ci-vm.toml "${{ steps.refs.outputs.old }}" "${RUNNER_TEMP}/disk" | tee build.log
          echo "path=$(tail -n 1 build.log)" >> "$GITHUB_OUTPUT"

      - name: Update, reboot, roll back
        if: steps.refs.outputs.old != ''
        run: |
          bash tests/vm/update-test.sh "${{ steps.build.outputs.path }}" "${RUNNER_TEMP}/vmkey" \
            "${{ steps.user.outputs.password }}" update-results "${{ steps.refs.outputs.new }}" "${{ steps.refs.outputs.new_digest }}"

      - name: Upload screenshots and logs
        if: always() && steps.refs.outputs.old != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: update-results-main
          path: |
            update-results/screens
            update-results/*.txt
            update-results/*.json
            update-results/serial.log
          if-no-files-found: warn
          retention-days: 30

  iso:
    name: Installer ISO (${{ matrix.flavor }})
    needs: vm-test
    if: (github.event_name == 'workflow_dispatch' && inputs.iso) || github.event_name == 'schedule'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      contents: read
      packages: read
    strategy:
      fail-fast: false
      matrix:
        flavor: [main, nvidia, nvidia-legacy]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Maximize build space
        uses: ublue-os/remove-unwanted-software@695eb75bc387dbcd9685a8e72d23439d8686cba6

      - name: Resolve image
        id: meta
        run: |
          set -a; source image.env; set +a
          # main -> IMAGE_MAIN, nvidia-legacy -> IMAGE_NVIDIA_LEGACY, ...
          var="IMAGE_$(tr 'a-z-' 'A-Z_' <<<"${{ matrix.flavor }}")"
          image="${!var}"
          echo "ref=${IMAGE_REGISTRY}/${image}:${DEFAULT_TAG}" >> "$GITHUB_OUTPUT"
          echo "name=${image}" >> "$GITHUB_OUTPUT"

      - name: Build installer ISO
        id: build
        run: |
          bash tests/vm/build-disk.sh anaconda-iso "disk_config/iso-${{ matrix.flavor }}.toml" "${{ steps.meta.outputs.ref }}" "${RUNNER_TEMP}/iso" | tee build.log
          echo "path=$(tail -n 1 build.log)" >> "$GITHUB_OUTPUT"

      - name: Name and checksum
        id: files
        run: |
          dir="${RUNNER_TEMP}/release"
          mkdir -p "${dir}"
          target="${dir}/${{ steps.meta.outputs.name }}-$(date -u +%Y%m%d)-x86_64.iso"
          mv "${{ steps.build.outputs.path }}" "${target}"
          (cd "${dir}" && sha256sum "$(basename "${target}")" > "$(basename "${target}").sha256")
          cat "${dir}"/*.sha256
          ls -lh "${dir}"
          echo "dir=${dir}" >> "$GITHUB_OUTPUT"

      - name: Upload ISO
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ steps.meta.outputs.name }}-iso
          path: |
            ${{ steps.files.outputs.dir }}/*.iso
            ${{ steps.files.outputs.dir }}/*.sha256
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

  install-test:
    name: Unattended install test (${{ matrix.flavor }})
    needs: vm-test
    if: (github.event_name == 'workflow_dispatch' && inputs.iso) || github.event_name == 'schedule'
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    permissions:
      contents: read
      packages: read
    strategy:
      fail-fast: false
      matrix:
        flavor: [main, nvidia, nvidia-legacy]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Maximize build space
        uses: ublue-os/remove-unwanted-software@695eb75bc387dbcd9685a8e72d23439d8686cba6

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Install QEMU
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends qemu-system-x86 qemu-utils ovmf openssh-client

      - name: Resolve image
        id: meta
        run: |
          set -a; source image.env; set +a
          # main -> IMAGE_MAIN, nvidia-legacy -> IMAGE_NVIDIA_LEGACY, ...
          var="IMAGE_$(tr 'a-z-' 'A-Z_' <<<"${{ matrix.flavor }}")"
          image="${!var}"
          echo "ref=${IMAGE_REGISTRY}/${image}:${DEFAULT_TAG}" >> "$GITHUB_OUTPUT"

      - name: Write an unattended test kickstart
        id: user
        run: |
          password="$(openssl rand -hex 10)"
          echo "::add-mask::${password}"
          echo "password=${password}" >> "$GITHUB_OUTPUT"
          ssh-keygen -q -t ed25519 -N "" -f "${RUNNER_TEMP}/vmkey"
          cat > disk_config/ci-install.toml <<EOF
          [customizations.installer.kickstart]
          contents = """
          text --non-interactive
          lang en_US.UTF-8
          keyboard us
          timezone UTC --utc
          zerombr
          clearpart --all --initlabel --disklabel=gpt
          autopart --noswap --type=btrfs
          network --bootproto=dhcp --device=link --activate --onboot=on
          rootpw --lock
          user --name=tamarack --password=${password} --plaintext --groups=wheel
          sshkey --username=tamarack "$(cat "${RUNNER_TEMP}/vmkey.pub")"
          services --enabled=sshd
          # Same as the release ISOs: graphical login even after a text-mode install.
          xconfig --startxonboot
          reboot
          %post --erroronfail
          bootc switch --mutate-in-place --enforce-container-sigpolicy --transport registry ${{ steps.meta.outputs.ref }}
          %end
          """

          [customizations.installer.modules]
          enable = [
            "org.fedoraproject.Anaconda.Modules.Storage",
            "org.fedoraproject.Anaconda.Modules.Runtime",
            "org.fedoraproject.Anaconda.Modules.Network",
            "org.fedoraproject.Anaconda.Modules.Security",
            "org.fedoraproject.Anaconda.Modules.Services",
            "org.fedoraproject.Anaconda.Modules.Users",
            "org.fedoraproject.Anaconda.Modules.Timezone",
            "org.fedoraproject.Anaconda.Modules.Localization",
          ]
          disable = ["org.fedoraproject.Anaconda.Modules.Subscription"]
          EOF

      - name: Build test installer ISO
        id: build
        run: |
          bash tests/vm/build-disk.sh anaconda-iso disk_config/ci-install.toml "${{ steps.meta.outputs.ref }}" "${RUNNER_TEMP}/iso" | tee build.log
          echo "path=$(tail -n 1 build.log)" >> "$GITHUB_OUTPUT"

      - name: Install, boot and test
        run: bash tests/vm/install-test.sh "${{ steps.build.outputs.path }}" "${RUNNER_TEMP}/vmkey" "${{ steps.user.outputs.password }}" install-results

      - name: Upload screenshots and logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: install-results-${{ matrix.flavor }}
          path: |
            install-results/screens
            install-results/*.txt
            install-results/installed-boot/screens
            install-results/installed-boot/*.txt
            install-results/installed-boot/*.json
          if-no-files-found: warn
          retention-days: 30
