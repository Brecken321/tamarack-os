---
name: Build images

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "docs/**"
  schedule:
    # Daily rebuild to pick up upstream Bazzite/Fedora security fixes.
    - cron: "40 7 * * *"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE_REGISTRY: ghcr.io/brecken321

jobs:
  checks:
    name: Lint and unit tests
    runs-on: ubuntu-26.04
    container: quay.io/fedora/fedora:44
    permissions:
      contents: read
    steps:
      - name: Install tools
        run: |
          dnf5 -y install --setopt=install_weak_deps=False \
            git python3 python3-pytest python3-mypy ruff ShellCheck just nodejs \
            desktop-file-utils python3-pyside6 kf6-kirigami qt6-qtsvg qt6-qtdeclarative \
            kf6-qqc2-desktop-style mesa-dri-drivers

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Trust the checkout (container runs as a different user)
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Lint
        run: just lint

      - name: Unit tests
        run: just test

      - name: Generated files are valid
        run: |
          just branding output/branding
          for js in output/branding/usr/share/plasma/look-and-feel/*/contents/layouts/*.js; do
            node --check "$js"
          done
          find output/branding -type f -name '*.desktop' -print0 | xargs -0 desktop-file-validate

      - name: Tamarack Center QML loads
        env:
          QT_QPA_PLATFORM: offscreen
          PYTHONPATH: src
        run: python3 -m tamarack.ui.app --self-test

  build:
    name: Build ${{ matrix.flavor }} image
    needs: checks
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      packages: write
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        flavor: [main, nvidia]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Maximize build space
        uses: ublue-os/remove-unwanted-software@695eb75bc387dbcd9685a8e72d23439d8686cba6

      - name: Install just
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4.0.0

      - name: Resolve image name
        id: meta
        run: |
          read -r image base < <(just variant ${{ matrix.flavor }})
          echo "image=${image}" >> "$GITHUB_OUTPUT"
          echo "base=${base}" >> "$GITHUB_OUTPUT"

      - name: Build image
        run: just build ${{ matrix.flavor }}

      - name: Check image contents
        run: just check-image ${{ matrix.flavor }}

      - name: Rechunk for smaller updates
        run: just rechunk ${{ matrix.flavor }}

      - name: Tag image
        id: tags
        run: |
          tags="$(just build-tags)"
          for tag in ${tags}; do
            podman tag "localhost/${{ steps.meta.outputs.image }}:stable" "localhost/${{ steps.meta.outputs.image }}:${tag}"
          done
          echo "tags=${tags}" >> "$GITHUB_OUTPUT"
          podman images

      # Pull requests never publish images.
      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push to GHCR
        id: push
        if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        env:
          TAGS: ${{ steps.tags.outputs.tags }}
          IMAGE: ${{ steps.meta.outputs.image }}
        run: |
          set -euo pipefail
          for tag in ${TAGS}; do
            podman push --digestfile=/tmp/digestfile "localhost/${IMAGE}:${tag}" "${IMAGE_REGISTRY}/${IMAGE}:${tag}"
          done
          echo "digest=$(< /tmp/digestfile)" >> "$GITHUB_OUTPUT"

      - name: Install cosign
        if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: "v3.1.2"

      - name: Sign image
        if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        env:
          COSIGN_EXPERIMENTAL: false
          COSIGN_PRIVATE_KEY: ${{ secrets.SIGNING_SECRET }}
          DIGEST: ${{ steps.push.outputs.digest }}
          IMAGE: ${{ steps.meta.outputs.image }}
        run: |
          # Old bundle format keeps signatures readable by rpm-ostree/containers-image
          # (same as ublue-os/image-template).
          cosign sign -y --new-bundle-format=false --use-signing-config=false \
            --key env://COSIGN_PRIVATE_KEY "${IMAGE_REGISTRY}/${IMAGE}@${DIGEST}"

      - name: Verify signature
        if: github.event_name != 'pull_request' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
          IMAGE: ${{ steps.meta.outputs.image }}
        run: cosign verify --key cosign.pub --insecure-ignore-tlog=true "${IMAGE_REGISTRY}/${IMAGE}@${DIGEST}" > /dev/null
