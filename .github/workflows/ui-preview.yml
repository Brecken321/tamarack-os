---
name: Center preview

# Renders every Tamarack Center page and Welcome step with example data, in
# the dark and light Tamarack themes, in about five minutes. This is for
# reviewing interface changes quickly; the VM test still checks the real app
# on a booted system.
on:
  push:
    paths:
      - "src/tamarack/ui/**"
      - "branding/**"
      - "system_files/usr/share/tamarack/flatpaks/**"
      - ".github/workflows/ui-preview.yml"
  pull_request:
    branches: [main]
    paths:
      - "src/tamarack/ui/**"
      - "branding/**"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  preview:
    name: Render Center pages
    runs-on: ubuntu-26.04
    container: quay.io/fedora/fedora:44
    timeout-minutes: 30
    steps:
      - name: Install tools
        run: |
          dnf5 -y install --setopt=install_weak_deps=False \
            git python3 python3-pyside6 python3-pillow kf6-kirigami kf6-qqc2-desktop-style qt6-qtsvg \
            qt6-qtdeclarative qt6-qtimageformats mesa-dri-drivers breeze-icon-theme google-noto-sans-fonts \
            librsvg2-tools flatpak plasma-integration plasma-breeze xorg-x11-server-Xvfb

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: QML loads
        env:
          QT_QPA_PLATFORM: offscreen
          PYTHONPATH: src
        run: python3 -m tamarack.ui.app --self-test

      - name: Render branding (wallpapers, preset previews, logo)
        run: PYTHONPATH=src:branding python3 -m tamarack_branding --brand branding/brand.toml --presets branding/presets --out output/branding

      - name: Download Flathub's catalog for app icons
        shell: bash
        run: |
          flatpak remote-add --user --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo
          flatpak update --user --appstream --noninteractive flathub
          catalog="${HOME}/.local/share/flatpak/appstream/flathub/x86_64/active"
          echo "APPSTREAM=${catalog}" >> "$GITHUB_ENV"

      # Same look as in a Plasma session: KDE platform theme (colors, icons
      # and fonts from kdeglobals), Breeze style, OpenGL (Mesa llvmpipe).
      - name: Render pages
        shell: bash
        env:
          QT_QPA_PLATFORM: xcb
          QT_QPA_PLATFORMTHEME: kde
          DISPLAY: ":99"
          PYTHONPATH: src
        run: |
          set -euo pipefail
          Xvfb :99 -screen 0 1280x900x24 -nolisten tcp &
          sleep 3
          for scheme in Dark Light; do
            config="$(mktemp -d)"
            icons=breeze
            [[ "${scheme}" == Dark ]] && icons=breeze-dark
            {
              cat "output/branding/usr/share/color-schemes/Tamarack${scheme}.colors"
              printf '\n[Icons]\nTheme=%s\n\n[KDE]\nwidgetStyle=Breeze\n' "${icons}"
            } > "${config}/kdeglobals"
            for mode in center welcome; do
              flag=""
              [[ "${mode}" == welcome ]] && flag="--welcome"
              XDG_CONFIG_HOME="${config}" XDG_DATA_DIRS="${PWD}/output/branding/usr/share:/usr/share" \
                python3 -m tamarack.ui.app --screenshots "preview/${scheme,,}" --data-root output/branding \
                --appstream "${APPSTREAM}" ${flag}
            done
            # A small window: the sidebar folds into a menu and grids drop to one column.
            if [[ "${scheme}" == Dark ]]; then
              for flag in "" --welcome; do
                XDG_CONFIG_HOME="${config}" XDG_DATA_DIRS="${PWD}/output/branding/usr/share:/usr/share" \
                  python3 -m tamarack.ui.app --screenshots preview/narrow --data-root output/branding \
                  --appstream "${APPSTREAM}" --size 640x760 ${flag}
              done
            fi
          done
          ls -R preview

      # Click every button, switch, card and action on every page and Welcome
      # step; fails if one does nothing or raises a QML error, also one raised
      # while the app closes (after the check's own report).
      - name: Every button does something
        shell: bash
        env:
          QT_QPA_PLATFORM: xcb
          QT_QPA_PLATFORMTHEME: kde
          QT_FORCE_STDERR_LOGGING: "1"
          DISPLAY: ":99"
          PYTHONPATH: src
        run: |
          set -euo pipefail
          # The screenshot step started it (the container has no pgrep).
          [[ -e /tmp/.X99-lock ]] || { Xvfb :99 -screen 0 1280x900x24 -nolisten tcp & sleep 3; }
          config="$(mktemp -d)"
          cp output/branding/usr/share/color-schemes/TamarackLight.colors "${config}/kdeglobals"
          output="$(mktemp)"
          status=0
          for flag in "" --welcome; do
            XDG_CONFIG_HOME="${config}" XDG_DATA_DIRS="${PWD}/output/branding/usr/share:/usr/share" HOME="$(mktemp -d)" \
              python3 -m tamarack.ui.app --check-buttons preview/buttons.md --data-root output/branding \
              --appstream "${APPSTREAM}" ${flag} 2>&1 | tee -a "${output}" || status=1
          done
          if grep -E 'qml:[0-9]+: (TypeError|ReferenceError)' "${output}"; then
            echo "::error::Tamarack Center printed QML errors (above)"
            status=1
          fi
          exit "${status}"

      - name: Upload previews
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: center-preview
          path: preview
          retention-days: 14
