# Anaconda installer profile for Tamarack OS (adapted from Bazzite's profile).
# Used when the installer runs from an environment whose os-release ID
# matches (for example a live ISO built from this image).

[Profile]
profile_id = @ID@

[Profile Detection]
os_id = @ID@

[Network]
default_on_boot = FIRST_WIRED_WITH_LINK

[Bootloader]
# The signed shim and GRUB live in EFI/fedora; do not change.
efi_dir = fedora
menu_auto_hide = True

[Storage]
default_scheme = BTRFS
btrfs_compression = zstd:1
default_partitioning =
    /     (min 1 GiB, max 70 GiB)
    /home (min 500 MiB, free 50 GiB)
    /var  (btrfs)

[Localization]
# Privacy: do not look up the user's location over the network.
use_geolocation = False
