# Optional app bundles offered in Tamarack Welcome and Tamarack Center.
# Every id must exist on Flathub (checked when this list was written; the
# weekly CI data job can re-check). Nothing here is installed unless the user
# picks it.

[[bundle]]
id = "gaming"
name = "Gaming extras"
description = "Manage Proton versions, run Epic/GOG games and Windows apps, tune the performance overlay."
apps = [
  { id = "com.vysp3r.ProtonPlus", name = "ProtonPlus (Proton versions)" },
  { id = "com.github.Matoking.protontricks", name = "Protontricks" },
  { id = "com.heroicgameslauncher.hgl", name = "Heroic Games Launcher (Epic, GOG, Amazon)" },
  { id = "com.usebottles.bottles", name = "Bottles (Windows apps)" },
  { id = "io.github.radiolamp.mangojuice", name = "MangoJuice (overlay settings)" },
  { id = "org.prismlauncher.PrismLauncher", name = "Prism Launcher (Minecraft)" },
]

[[bundle]]
id = "communication"
name = "Communication"
description = "Chat, voice and email."
apps = [
  { id = "com.discordapp.Discord", name = "Discord" },
  { id = "org.signal.Signal", name = "Signal" },
  { id = "org.mozilla.Thunderbird", name = "Thunderbird (email)" },
]

[[bundle]]
id = "office"
name = "Office and productivity"
description = "Documents, spreadsheets, presentations and a password manager."
apps = [
  { id = "org.libreoffice.LibreOffice", name = "LibreOffice" },
  { id = "org.keepassxc.KeePassXC", name = "KeePassXC (passwords)" },
]

[[bundle]]
id = "creator"
name = "Creator and streaming"
description = "Streaming and recording, video editing, painting, photo editing, audio and 3D."
apps = [
  { id = "com.obsproject.Studio", name = "OBS Studio (stream & record)" },
  { id = "org.kde.kdenlive", name = "Kdenlive (video editing)" },
  { id = "org.kde.krita", name = "Krita (painting)" },
  { id = "org.gimp.GIMP", name = "GIMP (photo editing)" },
  { id = "org.audacityteam.Audacity", name = "Audacity (audio)" },
  { id = "org.blender.Blender", name = "Blender (3D)" },
]

[[bundle]]
id = "media"
name = "Music and video"
description = "A music library player, a do-everything video player and audio effects for headsets."
apps = [
  { id = "org.kde.elisa", name = "Elisa (music)" },
  { id = "org.videolan.VLC", name = "VLC (video)" },
  { id = "com.github.wwmm.easyeffects", name = "Easy Effects (audio effects)" },
]

[[bundle]]
id = "browsers"
name = "Other web browsers"
description = "Firefox is installed by default. Add another browser if you need one."
apps = [
  { id = "org.chromium.Chromium", name = "Chromium" },
  { id = "com.brave.Browser", name = "Brave" },
  { id = "com.google.Chrome", name = "Google Chrome" },
]

[[bundle]]
id = "development"
name = "Development"
description = "Code editors, container tools and a GUI for distrobox Linux containers."
apps = [
  { id = "com.visualstudio.code", name = "Visual Studio Code" },
  { id = "org.kde.kate", name = "Kate (text editor)" },
  { id = "io.podman_desktop.PodmanDesktop", name = "Podman Desktop" },
  { id = "com.ranfdev.DistroShelf", name = "DistroShelf (distrobox)" },
]

[[bundle]]
id = "utilities"
name = "Backup and utilities"
description = "Scheduled encrypted backups, disk usage, cloud sync, app permissions and USB image writing."
apps = [
  { id = "org.gnome.DejaDup", name = "Déjà Dup (backups)" },
  { id = "org.kde.filelight", name = "Filelight (disk usage)" },
  { id = "com.nextcloud.desktopclient.nextcloud", name = "Nextcloud (cloud sync)" },
  { id = "com.github.tchx84.Flatseal", name = "Flatseal (app permissions)" },
  { id = "io.github.flattool.Warehouse", name = "Warehouse (manage Flatpaks)" },
  { id = "org.fedoraproject.MediaWriter", name = "Fedora Media Writer (USB images)" },
]
