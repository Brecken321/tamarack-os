# NVIDIA edition only (the unit comes from nvidia-container-toolkit).
# Without an NVIDIA GPU (a virtual machine, or the discrete GPU disabled in
# firmware) `nvidia-smi -L` fails and the unit retries until it is marked
# failed. Skip it instead when no NVIDIA PCI device (vendor 0x10de) exists.
[Service]
ExecCondition=/bin/sh -c 'grep -qs 0x10de /sys/bus/pci/devices/*/vendor'
