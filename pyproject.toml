[project]
name = "tamarack"
version = "0.1.0"
description = "Tamarack OS system tools"
requires-python = ">=3.11"
license = "Apache-2.0"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.isort]
known-first-party = ["tamarack", "tamarack_branding"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_ignores = true
mypy_path = ["src", "branding"]

[[tool.mypy.overrides]]
module = ["PySide6.*", "PIL.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "branding"]
